<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho da Sinceridade</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cantinho da Sinceridade ❤️</h1>
    </header>

    <main>
        <section id="mensagem">
            <h2>Deixe sua mensagem para mim quando você estiver triste</h2>
            <form action="https://formspree.io/f/xeoonall" method="POST" id="formulario">
                <label for="mensagem">Sua Mensagem:</label>
                <textarea id="mensagem" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>

        <section id="importancia">
            <p>Você é muito importante pra mim ❤️</p>
        </section>
    </main>

    <footer>
        <p>Com muito amor, de <strong>Davi</strong> para <strong>Vanessa</strong> ❤️</p>
    </footer>
</body>
</html>
